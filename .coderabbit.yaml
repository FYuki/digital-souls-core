# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja-JP
reviews:
  profile: assertive
  poem: false
  # Exact default exclusion without ! makes lock files reviewable without narrowing scope.
  path_filters: ['**/*.lock']
  path_instructions:
    - path: '**/*'
      instructions: >-
        CONTRIBUTING.md、AGENTS.md、README.md、SPEC.md、CONTEXT.md、関連するdocs/adrとdocs/*.mdを読み、
        差分を適用される規則・契約に照合してください。違反には該当規則を示してください。
        Coreの範囲（含むもの・含まないもの）は、READMEの「製品の範囲」・SPEC・ADRで判断してください。
        ADRはStatusと冒頭の置換注記を確認し、置き換えられた記述を現行の規則として扱わないでください。
        docs/evidenceは当時の証跡であり、現行の仕様の根拠にしないでください。
  auto_review:
    ignore_title_keywords: ['WIP', 'DO NOT MERGE']
    ignore_usernames: ['dependabot', 'github-actions', 'renovate']
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'SPEC.md'
      - 'CONTEXT.md'
      - 'docs/adr/*.md'
      - 'docs/*.md'
chat:
  art: false

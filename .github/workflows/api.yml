name: API checks

on:
  pull_request:
  push:
    branches: [main, 'epic/**']

permissions:
  contents: read

jobs:
  api-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.22
          uv lock --check
          uv sync --frozen
      - name: Lint, format and type contracts
        run: |
          bash -n tools/start-llamacpp.sh tools/test-postgres.sh
          uv run --no-sync ruff check src tests tools/evaluate-memory-search.py
          uv run --no-sync ruff format --check src tests tools/evaluate-memory-search.py
          uv run --no-sync mypy
      - name: Required unit tests (no network)
        run: uv run --no-sync pytest -m ut -q
      - name: Required integration tests (no network)
        run: uv run --no-sync pytest -m it1 -q
      - name: Build and install locked package
        run: |
          uv build --no-build-isolation
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/core-runtime.txt
          uv venv .package-check
          uv pip install --python .package-check/bin/python --require-hashes -r /tmp/core-runtime.txt
          uv pip install --python .package-check/bin/python --no-deps dist/*.whl
          .package-check/bin/python -I -c "from digital_souls_core.api import create_app; assert create_app().title == 'Digital Souls Core'"

  postgres-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.22
          uv lock --check
          uv sync --frozen
      - name: Required isolated PostgreSQL storage contracts
        run: bash tools/test-postgres.sh

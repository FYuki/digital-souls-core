name: Bootstrap checks

on:
  pull_request:
  push:
    branches: [main, 'epic/**']

permissions:
  contents: read

jobs:
  docs-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Test documentation checker
        run: node --test --test-reporter=./tools/required-tests-reporter.mjs tools/check-docs.test.mjs tools/required-tests-reporter.test.mjs
      - name: Check tracked documentation and config
        run: node tools/check-docs.mjs
      - name: Check patch whitespace
        run: git show --format= --check HEAD

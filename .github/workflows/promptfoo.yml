name: Semantic evaluation checks

on:
  pull_request:
  push:
    branches: [main, 'epic/**']

permissions:
  contents: read

jobs:
  promptfoo-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install locked Python toolchain
        run: |
          python -m pip install uv==0.8.22
          uv lock --check
          uv sync --frozen
      - name: Install locked evaluation dependency without lifecycle scripts
        shell: bash
        run: |
          umask 077
          npm_root=$(mktemp -d "$RUNNER_TEMP/core-semantic-npm.XXXXXXXX")
          mkdir -m 700 "$npm_root/home" "$npm_root/cache"
          touch "$npm_root/user.npmrc" "$npm_root/global.npmrc"
          env -i PATH="$PATH" HOME="$npm_root/home" npm_config_cache="$npm_root/cache" \
            npm_config_registry=https://registry.npmjs.org \
            npm_config_userconfig="$npm_root/user.npmrc" npm_config_globalconfig="$npm_root/global.npmrc" \
            npm_config_audit=false npm_config_fund=false npm_config_update_notifier=false \
            npm ci --prefix evals/semantic --ignore-scripts --no-audit --no-fund
          bash tools/build-semantic-sqlite.sh
      - name: Required evaluation contracts (no model calls)
        run: |
          bash -n tools/evaluate-semantic.sh
          bash -n tools/build-semantic-sqlite.sh
          node --test --test-reporter=./tools/required-tests-reporter.mjs evals/semantic/*.test.mjs
          uv run --no-sync pytest tests/test_semantic_provider.py tests/test_semantic_runner.py -m ut -q
      - name: Complete fixture suites in an isolated network namespace
        run: bash tools/evaluate-semantic.sh fixture
